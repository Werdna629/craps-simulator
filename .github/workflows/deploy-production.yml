name: Deploy production

# Publishes the master build to the root of the gh-pages branch
# (https://werdna629.github.io/craps-simulator/). PR previews live in
# subdirectories of the same branch, so we keep_files to avoid wiping them.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
